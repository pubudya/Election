<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sunrise Dental Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
    <div id="page-content">
        <section class="stats">
            <article class="card stat"><span>Today's visits</span><strong id="statToday">0</strong></article>
            <article class="card stat"><span>Scheduled</span><strong id="statScheduled">0</strong></article>
            <article class="card stat"><span>Completed</span><strong id="statCompleted">0</strong></article>
            <article class="card stat"><span>Today's billing</span><strong id="statRevenue">LKR 0.00</strong></article>
        </section>
        <section class="card panel">
            <h2>Today's appointment list</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Number</th>
                        <th>Patient</th>
                        <th>Dentist</th>
                        <th>Treatment</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="todayBody"></tbody>
                </table>
            </div>
        </section>
    </div>
</div>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
