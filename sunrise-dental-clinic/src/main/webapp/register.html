<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Appointment | Sunrise Dental Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
    <div id="page-content">
        <section class="card panel">
            <p class="hint">A unique appointment number is created automatically. The system rejects double bookings for the same dentist, date, and time.</p>
            <div id="registerAlert" class="alert"></div>
            <form id="registerForm">
                <div class="grid-2">
                    <div class="field">
                        <label for="patientName">Patient name</label>
                        <input id="patientName" required maxlength="100" placeholder="Full name">
                    </div>
                    <div class="field">
                        <label for="contactNumber">Contact number</label>
                        <input id="contactNumber" required maxlength="12" placeholder="0771234567">
                    </div>
                </div>
                <div class="field">
                    <label for="address">Address</label>
                    <input id="address" required maxlength="255" placeholder="Street, city">
                </div>
                <div class="grid-2">
                    <div class="field">
                        <label for="dentistId">Dentist</label>
                        <select id="dentistId" required>
                            <option value="">Select dentist</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="treatmentId">Treatment type</label>
                        <select id="treatmentId" required>
                            <option value="">Select treatment</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="field">
                        <label for="appointmentDate">Appointment date</label>
                        <input id="appointmentDate" type="date" required>
                    </div>
                    <div class="field">
                        <label for="appointmentTime">Appointment time</label>
                        <select id="appointmentTime" required>
                            <option value="">Select time</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="notes">Notes (optional)</label>
                    <textarea id="notes" rows="3" maxlength="500" placeholder="Allergies, preferred language, etc."></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Save appointment</button>
            </form>
        </section>
    </div>
</div>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
